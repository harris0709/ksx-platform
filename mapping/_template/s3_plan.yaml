# =====================================================================
# <기업> S3 데이터 전환·적재 계획 — 양식 (ksxload 입력, 구현안내서 6장)
#   복사: mapping/_template/s3_plan.yaml → mapping/<기업>/s3_plan.yaml
#   <…> 표시를 고객사 값으로 바꾼다. 작성 예시: mapping/impix/s3_plan.yaml
#
#   PYTHONPATH=tools/ksxload python -m ksxload <ddl|stage|gen|xfm|publish|check|review> --plan mapping/<기업>/s3_plan.yaml
#   Docker: docker compose --profile tools run --rm s3-tools <명령>   (환경변수 S3_PLAN으로 계획 지정)
# =====================================================================
enterprise: <ENT>                                  # 기업 코드(S2 계획과 같게)
s2_plan: mapping/<기업>/s2_plan.yaml               # 승인된 S2 매핑 계획
s1_config: mapping/<기업>/s1/s1_config.yaml        # 원천 접속(sources) — S1 설정 재사용
s1_extract: mapping/<기업>/s1/s1_extract_<ENT>.json

target:                                            # 원장 DB(S0 postgres, DB ksx) — 비밀번호는 .env에서
  host: "${KSX_DB_HOST:-localhost}"
  port: "${KSX_DB_PORT:-5432}"
  dbname: "${KSX_DB_NAME:-ksx}"
  admin:  { user: postgres,   password: "${POSTGRES_SUPERUSER_PASSWORD}" }   # ddl 최초 1회(권한 보강)
  owner:  { user: ksx_owner,  password: "${KSX_OWNER_PASSWORD}" }            # DDL·stg·xfm(dbt)
  loader: { user: ksx_loader, password: "${KSX_LOADER_PASSWORD}" }           # 표준 원장 적재(publish)

ddl: [ontologies/ddl/ksx.sql, ontologies/ddl/ext_<기업>.sql]                 # 표준 + 기업 확장 DDL(S2 ksxgen 생성물)

dbt:
  project: etl/dbt
  models: models/<기업>                            # gen 출력(직접 수정 금지)
  seeds: seeds/<기업>

# ---------------------------------------------------------------- 정제 규칙
# 1차: S1 품질 이슈 '상'마다 규칙 초안을 적는다. 2차: 첫 publish의 FK 검사에서 새로 나온 고아를 S3-xx 이슈로 추가한다.
# 3차: 현업 검토(review 절)로 처리 방식을 확정한다. 모든 규칙은 이슈 ID와 note(근거)를 단다.
#
# action          필수 키                         처리
#   dedupe          keep                          같은 UK 중 keep 순서로 1행만
#   quarantine      when 또는 orphan              적재 안 함
#   nullify_orphan  orphan                        부모에 없는 참조 컬럼만 NULL
#   replace_orphan  orphan, with                  부모에 없는 참조 컬럼을 with 식으로
#   correct         when, set                     when이 참인 행의 set 컬럼을 고침(독립 근거 2개 이상일 때만)
#   flag            when                          그대로 적재, 확인 대상 표시
# 식 안의 m은 규칙 적용 전 모델 행(m."컬럼"), 다른 모델은 {{ ref('<모델>__src') }}(순환 방지), 원천은 {{ source('stg', '<시스템>__<테이블>') }}
rules:
  - { id: R01, issue: Q001, model: ItemMaster, action: dedupe,
      keep: '"ModificationDateTime" desc nulls last, "UseIndicator" desc',
      note: "<근거 — 무엇이 왜 문제이고 어떻게 처리하는가>" }
  - { id: R02, issue: Q002, model: <모델>, action: nullify_orphan,
      orphan: { columns: [<참조 컬럼>], parent: <부모 명사> },
      note: "<근거>" }
  - { id: R03, issue: Q003, model: <모델>, action: quarantine,
      when: 'm."<컬럼>" > 10 * (select p."USL" from {{ ref(''EquipmentParameter'') }} p where p."ParameterID" = m."ParameterID")',
      note: "<근거>" }

# ---------------------------------------------------------------- 정제 규칙 검토(구현안내서 6.7) — 현업과 함께 결정
# ksxload review가 이 절 + 마지막 publish 기록으로 검토서(S3_정제규칙_검토서_<ENT>.xlsx)를 만든다.
# 같은 이슈의 파생 규칙(R07b 등)은 앞 규칙(R07)의 검토를 따른다. 결정 전에는 decision을 비워 둔다(검토서 '미결정').
review:
  R01:
    finding: "<원천 확인 결과 — 문제 행, 같은 맥락의 다른 기록, 전체 분포와의 비교>"
    options: "A. <방식과 영향> / B. <방식과 영향>"
    decision: ""                                   # 예: "B — 보정. 근거 2개 일치"
    decided: ""                                    # 결정일 YYYY-MM-DD
    request: "<원천 정정 요청 — 없으면 이 줄 삭제>"

# S3에서 S2 매핑 명세로 되돌아간 결정 — S2 승인 기록 '사후 변경'에도 남긴다
s2_regressions: []
#  - { id: S2R-01, subject: "<대상>", finding: "<원천 확인>", options: "A. … / B. …", decision: "<결정>", decided: "YYYY-MM-DD" }

approval:
  status: pending                                  # pending / approved / conditional(조건부) / rejected
  date: ""
  decision: ""
  carry_over: []                                   # 다음 단계로 넘기는 과제(예: 증분 적재 CDC)
  signers:
    - { role: "데이터 엔지니어(reviewed)", name: "", date: "", note: "" }
    - { role: "도메인(PI) 컨설턴트(approved)", name: "", date: "", note: "" }
    - { role: "고객사 현업 검수자(approved)", name: "", date: "", note: "" }
