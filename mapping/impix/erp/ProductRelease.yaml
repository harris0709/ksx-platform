# ProductRelease ← erp.tb_sd_dlv (1:1) — automap 생성, 계획: s2_plan.yaml
# 상태: draft(자동) → reviewed(데이터 엔지니어) → approved(도메인·현업)
noun: ProductRelease
layer: core
structure: '1:1'
source: {system: ERP, table: erp.tb_sd_dlv}
base: {EnterpriseID: const(IMPIX), SiteID: const(HQ), PlantID: 'xref(wh_plant, wh_cd)'}
identity:
- ProductReleaseID
- ProductReleaseSequence
attributes:
  ProductReleaseID: {from: dlv_no, match: normalized, status: approved}
  ProductReleaseSequence: {match: const, transform: const(1), note: 원천 1행 = 1출고, status: approved}
  SalesDocumentNumber: {from: so_no, match: normalized, status: approved}
  SalesDocumentSequence: {from: so_seq, match: normalized, status: approved}
  SalesQuantity: {from: dlv_qty, match: manual, status: approved}
  InventoryTransactionDate: {from: dlv_dt, match: manual, transform: to_date8(dlv_dt), status: approved}
  LotID: {from: lot_no, match: normalized, status: approved}
  ReturnIndicator: {from: rtn_yn, match: normalized, transform: yn(rtn_yn), status: approved}
  WarehouseID: {from: wh_cd, match: normalized, status: approved}
  CustomerID: {from: cust_cd, match: normalized, status: approved}
  ItemID: {from: item_cd, match: normalized, transform: upper_trim(item_cd), status: approved}
extension: {}
excluded: []
