# ItemMaster ← erp.tb_mm_item (1:1) — automap 생성, 계획: s2_plan.yaml
# 상태: draft(자동) → reviewed(데이터 엔지니어) → approved(도메인·현업)
noun: ItemMaster
layer: core
structure: '1:1'
source: {system: ERP, table: erp.tb_mm_item, filter: item_cd NOT LIKE 'TEST%'}
base: {EnterpriseID: const(IMPIX), SiteID: const(HQ), PlantID: 'xref(plant, plant_cd)'}
identity:
- ItemID
attributes:
  ItemType: {from: item_tp, match: normalized, code: ITEM_TP -> ItemType, status: reviewed}
  ItemLargeClass: {from: item_grp, match: normalized, code: ITEM_GRP -> ItemLargeClass, status: reviewed}
  ItemUOMCode: {from: unit, match: manual, uom: unit, note: ea·개 → EA 정규화(Q004), status: reviewed}
  WeightUOMCode: {from: wgt_unit, match: normalized, uom: wgt_unit, status: reviewed}
  SafetyStock: {from: safety_qty, match: manual, status: reviewed}
  PurchaseLeadTime: {from: pur_lt, match: normalized, transform: days(pur_lt), status: reviewed}
  ProductionLeadTime: {from: prd_lt, match: normalized, transform: days(prd_lt), status: reviewed}
  DrawingNumber: {from: drw_no, match: normalized, status: reviewed}
  IncomingInspectionIndicator: {from: iqc_yn, match: normalized, transform: yn(iqc_yn), status: reviewed}
  FinalInspectionIndicator: {from: fqc_yn, match: normalized, transform: yn(fqc_yn), status: reviewed}
  OutgoingInspectionIndicator: {from: oqc_yn, match: normalized, transform: yn(oqc_yn), status: reviewed}
  ItemID: {from: item_cd, match: normalized, transform: upper_trim(item_cd), status: reviewed}
  ItemName: {from: item_nm, match: normalized, status: reviewed}
  ItemSpecification: {from: item_spec, match: normalized, status: reviewed}
  ModelName: {from: model_nm, match: normalized, status: reviewed}
  Weight: {from: wgt, match: normalized, status: reviewed}
  LotControlIndicator: {from: lot_yn, match: component, transform: yn(lot_yn), status: reviewed}
  LotSize: {from: lot_size, match: exact, status: reviewed}
  UseIndicator: {from: use_yn, match: normalized, transform: yn(use_yn), status: reviewed}
  CreationDateTime: {from: reg_dt, match: normalized, transform: to_ts(reg_dt), status: reviewed}
  ModificationDateTime: {from: upd_dt, match: normalized, transform: to_ts(upd_dt), status: reviewed}
extension: {}
excluded: []
