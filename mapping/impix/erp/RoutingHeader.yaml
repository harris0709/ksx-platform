# RoutingHeader ← erp.tb_pp_rout_h (1:1) — automap 생성, 계획: s2_plan.yaml
# 상태: draft(자동) → reviewed(데이터 엔지니어) → approved(도메인·현업)
noun: RoutingHeader
layer: core
structure: '1:1'
source: {system: ERP, table: erp.tb_pp_rout_h}
base: {EnterpriseID: const(IMPIX), SiteID: const(HQ), PlantID: 'xref(plant, plant_cd)'}
identity:
- RoutingID
attributes:
  RoutingID: {from: rout_cd, match: normalized, status: reviewed}
  RoutingName: {from: rout_nm, match: normalized, status: reviewed}
  ItemID: {from: item_cd, match: normalized, transform: upper_trim(item_cd), status: reviewed}
  UseIndicator: {from: use_yn, match: normalized, transform: yn(use_yn), status: reviewed}
extension: {}
excluded: []
