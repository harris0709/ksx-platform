# GoodsIssue ← erp.tb_mm_gi (1:1) — automap 생성, 계획: s2_plan.yaml
# 상태: draft(자동) → reviewed(데이터 엔지니어) → approved(도메인·현업)
noun: GoodsIssue
layer: core
structure: '1:1'
source: {system: ERP, table: erp.tb_mm_gi}
base: {EnterpriseID: const(IMPIX), SiteID: const(HQ), PlantID: 'xref(wh_plant, wh_cd)'}
identity:
- GoodsIssueID
attributes:
  GoodsIssueID: {from: gi_no, match: normalized, status: reviewed}
  InventoryTransactionTypeCode: {from: gi_tp, match: manual, code: GI_TP -> InventoryTransactionTypeCode, status: reviewed}
  ItemUnitQuantity: {from: gi_qty, match: manual, status: reviewed}
  WarehouseID: {from: wh_cd, match: normalized, status: reviewed}
  Note: {from: rmk, match: manual, status: reviewed}
  ItemID: {from: item_cd, match: normalized, transform: upper_trim(item_cd), status: reviewed}
extension:
  InventoryTransactionDate: {from: gi_dt, match: manual, transform: to_date8(gi_dt), status: reviewed}
  ProductionOrderID: {from: mo_no, match: normalized, status: reviewed}
  ProductionOrderSequence: {match: const, transform: const(1), note: 오더 순번 고정 1 — mo_no가 있는 행(생산 투입)만, status: reviewed}
excluded: []
