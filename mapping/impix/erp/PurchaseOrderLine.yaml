# PurchaseOrderLine ← erp.tb_mm_po_d (1:1) — automap 생성, 계획: s2_plan.yaml
# 상태: draft(자동) → reviewed(데이터 엔지니어) → approved(도메인·현업)
noun: PurchaseOrderLine
layer: core
structure: '1:1'
source: {system: ERP, table: erp.tb_mm_po_d}
join:
- {table: erp.tb_mm_po_h, as: h, 'on': po_no = h.po_no}
base: {EnterpriseID: const(IMPIX), SiteID: const(HQ), PlantID: const(P2)}
identity:
- PurchaseDocumentNumber
- PurchaseDocumentSequence
attributes:
  PurchaseDocumentNumber: {from: po_no, match: normalized, status: reviewed}
  PurchaseDocumentSequence: {from: po_seq, match: normalized, status: reviewed}
  PurchaseOrderQuantity: {from: po_qty, match: normalized, status: reviewed}
  PurchaseOrderUnitPrice: {from: unit_prc, match: manual, status: reviewed}
  ExpectedDeliveryDate: {from: due_dt, match: manual, transform: to_date8(due_dt), status: reviewed}
  PurchaseGoodsReceiptQuantity: {from: gr_qty, match: component, status: reviewed}
  PurchaseOrderLineStatusCode: {from: h.po_stat, match: manual, code: PO_STAT -> PurchaseOrderLineStatusCode, note: 라인 상태 없음 — 헤더 상태 상속, status: reviewed}
  ItemID: {from: item_cd, match: normalized, transform: upper_trim(item_cd), status: reviewed}
extension: {}
excluded: []
