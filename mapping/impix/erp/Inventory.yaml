# Inventory ← erp.tb_mm_stock_day (이력→현재(마지막 기준일)) — automap 생성, 계획: s2_plan.yaml
# 상태: draft(자동) → reviewed(데이터 엔지니어) → approved(도메인·현업)
noun: Inventory
layer: core
structure: 이력→현재(마지막 기준일)
source: {system: ERP, table: erp.tb_mm_stock_day, filter: stk_dt = (SELECT max(stk_dt) FROM erp.tb_mm_stock_day)}
base: {EnterpriseID: const(IMPIX), SiteID: const(HQ), PlantID: 'xref(wh_plant, wh_cd)'}
identity:
- WarehouseID
- ItemID
attributes:
  WarehouseID: {from: wh_cd, match: normalized, status: approved}
  InventoryQuantity: {from: stk_qty, match: normalized, status: approved}
  ItemID: {from: item_cd, match: normalized, transform: upper_trim(item_cd), status: approved}
extension: {}
excluded:
- {column: stk_dt, reason: '기준일 — 필터(마지막 기준일)에 사용, 이력은 InventorySnapshot'}
