# =====================================================================
# IMPIX S3 데이터 전환·적재 계획 — ksxload 입력(구현안내서 6장)
#   PYTHONPATH=tools/ksxload python -m ksxload <ddl|stage|gen|xfm|publish|check> --plan mapping/impix/s3_plan.yaml
#
# 흐름: 원천(impix-src) → stg(복제) → xfm(dbt 변환 뷰) → ksx·ext(표준 원장, FK·UK 적용)
#   ddl     표준·확장 DDL 적용, xfm 스키마, audit 적재 기록 테이블
#   stage   원천 56개 테이블 → stg.<시스템>__<테이블> 전체 복제(초기 적재)
#   gen     승인된 매핑 명세(mapping/impix/{erp,mes,qms}/*.yaml) + 정제 규칙 → dbt 모델·테스트·seed
#   (dbt)   dbt seed → dbt run → dbt test   (dbt가 없는 환경은 ksxload xfm이 같은 SQL을 실행)
#   publish xfm 뷰 → 표준 원장(한 트랜잭션, FK 지연 검사) + 대사(행 수·합계·UK·필수값·FK 고아·코드)
# =====================================================================
enterprise: IMPIX
s2_plan: mapping/impix/s2_plan.yaml        # 승인된 매핑 계획(명세·대응표의 원본)
s1_config: mapping/impix/s1/s1_config.yaml # 원천 접속(sources)
s1_extract: mapping/impix/s1/s1_extract_IMPIX.json

target:                                    # 원장 DB(S0 postgres 서비스, DB ksx)
  host: "${KSX_DB_HOST:-localhost}"
  port: "${KSX_DB_PORT:-5432}"
  dbname: "${KSX_DB_NAME:-ksx}"
  admin:  { user: postgres,   password: "${POSTGRES_SUPERUSER_PASSWORD}" }   # ddl 최초 1회: 권한 보강(스키마 생성)
  owner:  { user: ksx_owner,  password: "${KSX_OWNER_PASSWORD}" }    # DDL·stg·xfm(dbt)
  loader: { user: ksx_loader, password: "${KSX_LOADER_PASSWORD}" }   # 표준 원장 적재(publish)

ddl: [ontologies/ddl/ksx.sql, ontologies/ddl/ext_impix.sql]

dbt:
  project: etl/dbt
  models: models/impix                     # gen 출력(직접 수정 금지)
  seeds: seeds/impix

# ---------------------------------------------------------------- 정제 규칙(S1 품질 이슈 → S3 처리)
# action
#   dedupe          같은 UK가 여러 행이면 keep 순서로 1행만 남기고 나머지는 격리 기록
#   quarantine      when(모델 출력 컬럼, 별칭 m)이 참인 행을 적재하지 않고 audit.quarantine에 기록
#   nullify_orphan  columns가 부모 명사(parent)에 없으면 그 컬럼만 NULL로 비우고 기록(행은 적재)
#   replace_orphan  columns가 부모 명사에 없으면 with의 식(모델 컬럼, 별칭 m)으로 바꾸고 기록
#   correct         when이 참인 행의 set 컬럼을 식으로 고치고 원래 행을 기록(근거가 일치할 때만)
#   flag            적재는 그대로, 해당 행을 기록만(현업 확인 대상)
# 처리 결과는 publish가 audit.quarantine·audit.load_log에 남긴다.
rules:
  - { id: R01, issue: Q001, model: ItemMaster, action: dedupe,
      keep: '"ModificationDateTime" desc nulls last, "UseIndicator" desc nulls last',
      note: "대소문자·공백만 다른 품목코드 중복 — upper_trim 후 같은 키. 최근 수정·사용 중인 행을 남김" }
  - { id: R02, issue: Q002, model: BOMLine, action: quarantine,
      orphan: { columns: [ChildItemID], parent: ItemMaster },
      note: "BOM 자품목 IMP-B300이 품목마스터에 없음 — 입력 오류로 판단(임펠러 IMP-B200 중복), ERP에서 BOM 행 삭제 요청(2026-10-30 결정)" }
  - { id: R03, issue: Q003, model: ProductIncoming, action: nullify_orphan,
      orphan: { columns: [ProductionOrderID, ProductionOrderSequence], parent: ProductionOrder },
      note: "제품입고의 생산지시 MO260999001이 ERP에 없음 — 입고는 적재, 오더 참조만 비움" }
  - { id: R04, issue: Q005, model: Lot, action: nullify_orphan,
      orphan: { columns: [ProductionOrderID, ProductionOrderSequence], parent: ProductionOrder },
      note: "LOT E261008B1의 생산지시 MO260999001이 ERP에 없음 — LOT는 적재, 오더 참조만 비움" }
  - { id: R09, issue: Q005, model: ProductionPerformance, action: nullify_orphan,
      orphan: { columns: [ProductionOrderID, ProductionOrderSequence], parent: ProductionOrder },
      note: "Q005 전파 — MO260999001을 가진 LOT(H260925A2·E261008B1)의 공정 실적 11행. 실적은 적재, 오더 참조만 비움(S3 publish FK 검사에서 발견)" }
  - { id: R10, issue: S3-01, model: Enterprise, action: nullify_orphan,
      orphan: { columns: [CreatorID], parent: Personnel },
      note: "회사 등록자 SYS는 시스템 계정(사원 아님) — 등록자만 비움(S3 publish FK 검사에서 발견)" }
  - { id: R05, issue: Q006, model: TraceParameter, action: quarantine,
      when: 'm."ParameterValue" > 10 * (select p."USL" from {{ ref(''EquipmentParameter'') }} p where p."ParameterID" = m."ParameterID")',
      note: "규격 상한의 10배를 넘는 수집값 — 단위 오류 의심, 시계열 분석에서 제외" }
  - { id: R06, issue: Q008, model: OperationStart, action: replace_orphan,
      orphan: { columns: [PersonnelID], parent: Personnel },
      with: { PersonnelID: '(select pp."PersonnelID" from {{ ref(''ProductionPerformance__src'') }} pp where pp."LotID" = m."LotID" and pp."OperationID" = m."OperationID")' },
      note: "착공 작업자 OP01(포장 단말 공용 계정, MES 도입 초기 9/21~22)은 사번이 아님 — 같은 LOT·공정의 완공 작업자로 보정(2026-10-30 결정)" }
  - { id: R07, issue: Q009, model: ProductionPerformance, action: correct,
      when: 'm."ProducedQuantity" + m."DefectQuantity" <> (select os."LotCreatedQuantity" from {{ ref(''OperationStart__src'') }} os where os."LotID" = m."LotID" and os."OperationID" = m."OperationID")',
      set: { ProducedQuantity: '(select os."LotCreatedQuantity" from {{ ref(''OperationStart__src'') }} os where os."LotID" = m."LotID" and os."OperationID" = m."OperationID") - m."DefectQuantity"' },
      note: "완공 양품 +3 과다 입력(E260925B1 A100·A200) — 양품 = 착공 투입 − 불량으로 보정. 다음 공정 투입·공정검사 양품과 일치(2026-10-30 결정)" }
  - { id: R07b, issue: Q009, model: OperationEnd, action: correct,
      when: 'm."ProducedQuantity" + m."DefectQuantity" <> (select os."LotCreatedQuantity" from {{ ref(''OperationStart__src'') }} os where os."LotID" = m."LotID" and os."OperationID" = m."OperationID")',
      set: { ProducedQuantity: '(select os."LotCreatedQuantity" from {{ ref(''OperationStart__src'') }} os where os."LotID" = m."LotID" and os."OperationID" = m."OperationID") - m."DefectQuantity"' },
      note: "R07과 같은 완공 기록 — 완공(OperationEnd) 양품도 같은 값으로 보정" }
  - { id: R07c, issue: Q009, model: ProductionPerformanceEquipment, action: correct,
      when: 'm."ProducedQuantity" <> (select pp."ProducedQuantity" from {{ ref(''ProductionPerformance'') }} pp where pp."ProductionPerformanceID" = m."ProductionPerformanceID")',
      set: { ProducedQuantity: '(select pp."ProducedQuantity" from {{ ref(''ProductionPerformance'') }} pp where pp."ProductionPerformanceID" = m."ProductionPerformanceID")' },
      note: "R07과 같은 완공 기록 — 생산실적 설비의 양품도 보정된 생산실적 값으로" }
  - { id: R08, issue: Q010, model: ProductionPerformance, action: correct,
      when: 'm."ExecutionEndDateTime" < m."ExecutionStartDateTime" and (select max(q.insp_dtm) from {{ source(''stg'', ''mes__tb_qc_insp'') }} q where q.lot_no = m."LotID" and q.proc_cd = m."OperationID") >= m."ExecutionStartDateTime"',
      set: { ExecutionEndDateTime: '(select max(q.insp_dtm) from {{ source(''stg'', ''mes__tb_qc_insp'') }} q where q.lot_no = m."LotID" and q.proc_cd = m."OperationID")', ProductionPerformanceDate: 'cast((select max(q.insp_dtm) from {{ source(''stg'', ''mes__tb_qc_insp'') }} q where q.lot_no = m."LotID" and q.proc_cd = m."OperationID") as date)' },
      note: "완공 일시가 착공보다 5분 빠름(E261009A2 A200 14:52) — 완공 = 공정검사 시각(16:35)으로 보정. A200 77건 중 76건이 검사 시각 = 완공 시각, 보정 후 98분(중앙값 99분), 다음 공정 착공 16:45(2026-10-30 결정)" }
  - { id: R08b, issue: Q010, model: OperationEnd, action: correct,
      when: 'm."OperationEndTime" < (select os."OperationStartTime" from {{ ref(''OperationStart__src'') }} os where os."LotID" = m."LotID" and os."OperationID" = m."OperationID") and (select max(q.insp_dtm) from {{ source(''stg'', ''mes__tb_qc_insp'') }} q where q.lot_no = m."LotID" and q.proc_cd = m."OperationID") >= (select os."OperationStartTime" from {{ ref(''OperationStart__src'') }} os where os."LotID" = m."LotID" and os."OperationID" = m."OperationID")',
      set: { OperationEndTime: '(select max(q.insp_dtm) from {{ source(''stg'', ''mes__tb_qc_insp'') }} q where q.lot_no = m."LotID" and q.proc_cd = m."OperationID")' },
      note: "R08과 같은 완공 기록 — 완공(OperationEnd) 시각도 공정검사 시각으로 보정" }
  - { id: R08c, issue: Q010, model: ProductionPerformanceEquipment, action: correct,
      when: 'm."ExecutionEndDateTime" < m."ExecutionStartDateTime"',
      set: { ExecutionEndDateTime: '(select pp."ExecutionEndDateTime" from {{ ref(''ProductionPerformance'') }} pp where pp."ProductionPerformanceID" = m."ProductionPerformanceID")' },
      note: "R08과 같은 완공 기록 — 생산실적 설비의 완공 일시도 보정된 생산실적 값으로" }
# Q004·Q011(출하·클레임 LOT가 MES에 없음)은 S2 로트 A안(Lot_shipped)으로, Q007(MES 일 집계)은 테이블 제외로 처리됨.

# ---------------------------------------------------------------- 정제 규칙 검토(구현안내서 6.7, 현업 공동 결정)
# 규칙마다 원천 데이터를 현업과 함께 보고 정한 결과. ksxload review가 이 절과 마지막 적재 기록(audit)으로
# 검토서(mapping/impix/S3_정제규칙_검토서_IMPIX.xlsx)를 만든다. 같은 이슈의 파생 규칙(R07b 등)은 앞 규칙(R07)을 따른다.
#   finding  원천 확인 결과(교차 확인 포함)    options  검토한 선택지(A/B/C)
#   decision 결정(선택지와 이유)               request  원천 정정 요청(데이터 소유 부서에 보낼 내용, 없으면 생략)
review:
  R01:
    finding: "EWP-A100(공백 붙은 코드)·ewp-b200(소문자, 사용 안 함)이 기존 품목과 같은 품목으로 다시 등록됨. 품명·모델 같고, 기존 행이 안전재고·도면 등 속성이 더 완전"
    options: "A. 최근 수정·사용 중인 행만 남김(중복 정리) / B. 둘 다 적재(UK 위반으로 불가)"
    decision: "A — 최근 수정·사용 중인 행을 남김"
    decided: "2026-10-30"
    request: "ERP 품목마스터의 중복 등록 행 사용 중지"
  R02:
    finding: "BOM 자품목 IMP-B300이 품목마스터에 없음. 같은 BOM의 다른 자품목은 정상 — 입력 오류"
    options: "A. 격리(적재 안 함) / B. 자품목만 비우고 적재"
    decision: "A — 격리. 입력 오류로 판단"
    decided: "2026-10-30"
    request: "ERP BOM에서 해당 자품목 행 삭제(입력 오류)"
  R03:
    finding: "제품입고 2건의 생산지시 MO260999001이 생산오더에 없음. LOT·수량·일자는 정상"
    options: "A. 오더 참조만 비우고 실적은 적재 / B. 격리(실적 누락) / C. 가상 오더 생성"
    decision: "A — 오더 참조만 비움. 같은 오더 번호인 R04·R09와 함께 결정"
    decided: "2026-10-30"
    request: "MO260999001의 실제 오더 번호 확인 — 제품입고(R03)·LOT(R04)·공정 실적(R09) 16행"
  R04:
    finding: "R03과 같은 오더 번호 MO260999001을 LOT 3개가 참조"
    options: "R03과 같음"
    decision: "A — 오더 참조만 비움(R03과 함께 결정)"
    decided: "2026-10-30"
  R09:
    finding: "R04 LOT의 공정 실적 11건도 같은 오더를 참조(S3 FK 검사에서 발견)"
    options: "R03과 같음"
    decision: "A — 오더 참조만 비움(R03과 함께 결정)"
    decided: "2026-10-30"
  R05:
    finding: "LKT-02 누설률 7건(2026-10-11 09:00~10:00, 307~1,142 cm3/min)이 규격 상한 2의 150~570배. 센서·단위 오류 의심, 바로잡을 근거 없음"
    options: "A. 격리(추적·SPC 계산에서 뺌) / B. 표시만(이상값이 SPC·추적에 들어감)"
    decision: "A — 격리"
    decided: "2026-10-30"
    request: "LKT-02 누설률 센서·수집 단위 점검(설비보전팀)"
  R06:
    finding: "착공 작업자 OP01이 사원 마스터에 없음. OP01은 포장 단말 공용 계정. 같은 LOT·공정의 완공 작업자는 사원 마스터에 있음"
    options: "A. 작업자만 비움 / B. 같은 LOT·공정의 완공 작업자로 바꿈"
    decision: "B — 완공 작업자로 대체(replace_orphan)"
    decided: "2026-10-30"
    request: "포장 단말 공용 계정(OP01) 사용 금지, 개인 사번 로그인"
  R07:
    finding: "E260925B1 A100·A200 완공 양품이 +3 과다(양품+불량 > 착공 투입). 다음 공정 투입·공정검사 양품은 착공 투입 − 불량과 같음"
    options: "A. 표시만(현업 확인) / B. 양품 = 착공 투입 − 불량으로 보정"
    decision: "B — 보정. 근거 2개(다음 공정 투입, 공정검사 양품) 일치. 생산실적·완공·생산실적 설비 3개 테이블에 같이 적용"
    decided: "2026-10-30"
    request: "MES 완공 단말 양품 수량 입력 확인"
  R08:
    finding: "E261009A2 A200 완공 14:52 < 착공 14:57. 공정검사 16:35(A200 77건 중 76건이 검사 시각 = 완공 시각), 다음 공정 착공 16:45"
    options: "A. 표시만(현업 확인) / B. 완공 = 공정검사 시각으로 보정"
    decision: "B — 보정(98분, A200 중앙값 99분). 생산실적·완공·생산실적 설비 3개 테이블에 같이 적용"
    decided: "2026-10-30"
    request: "MES 완공 단말 시각 입력(직접 입력·이전 LOT 시각) 확인"
  R10:
    finding: "회사 등록자 SYS가 사원 마스터에 없음. ERP 설치(2020-01-02) 때 시스템 계정"
    options: "A. 등록자만 비움 / B. 시스템 계정을 인원으로 등록"
    decision: "A — 등록자만 비움(인원 원장에 가상 인원을 넣지 않음)"
    decided: "2026-10-30"

# S3에서 S2 매핑 명세로 되돌아간 결정(구현안내서 6.7) — S2 승인 기록 '사후 변경'에도 남김
s2_regressions:
  - id: S2R-01
    subject: "본사 조직의 공장"
    finding: "부서 3개(생산본부·품질경영팀·생산관리팀)와 사원 1명의 plant_cd가 비어 있음. 표준은 공장식별자 필수. 이 조직들은 두 공장을 함께 관리"
    options: "A. 제2공장(P2) / B. 제1공장(P1) / C. 생산하지 않는 본사(HQ) 공장 추가"
    decision: "C — 본사(HQ) 공장 1행 추가(erp/Plant_hq.yaml), 부서·사원 기본값 HQ. 생산능력·OEE 집계 대상 아님"
    decided: "2026-10-30"

approval:
  status: conditional                      # approved / conditional(조건부) / rejected
  date: "2026-10-30"
  decision: "조건부 승인 — 초기 적재 결과 승인, 증분 적재(CDC)는 다음 단계 과제"
  carry_over:
    - "증분 적재(CDC): Debezium·Kafka 또는 변경일시 배치(표 13 증분 지연 목표)"
    - "사업장 RLS: ksx.enable_site_rls()를 원장 테이블에 적용(S9 보안과 함께)"
    - "확장 단위 후보(N·m, cc/min): 원천 단위 문자열 유지(S2 과제)"
  signers:
    - { role: "데이터 엔지니어(reviewed)", name: "Claude(적재·대사)", date: "2026-10-30", note: "완료 기준 6/7 충족(증분은 다음 단계)" }
    - { role: "도메인(PI) 컨설턴트(approved)", name: "장홍관", date: "2026-10-30", note: "조건부 승인 — 정제 규칙 원천 검토 완료, 본사 공장 C안" }
    - { role: "고객사 현업 검수자(approved)", name: "장홍관(겸임)", date: "2026-10-30", note: "원천 정정 요청 항목 확인" }
