# =====================================================================
# IMPIX 1차 업무 시나리오 정의 + 업무 질의서 (S1 절차 1~3)
#   시나리오의 대상 명사·원천 공백은 s1_config.yaml 의 scenarios 와 같은 ID(SC01~SC07)를 쓴다.
#   scenarios.<ID>.kpi: KPI 정의서에 없는 보조 관리지표만 적는다(정식 KPI는 kpi_catalog.yaml 의 scenarios 로 연결).
#   questions[].kpi: 질의가 검증하는 KPI ID(kpi_catalog.yaml). answer 의 수치는 s1profiler kpi 산출값과 같다.
#   질의서는 S7 추론 규칙과 S9 AI 평가의 기준이 된다. answer 는 실습 데이터 기준 정답(검증용).
#   생성: python -m s1profiler scenarios --config mapping/impix/s1/s1_config.yaml
# =====================================================================
company:
  name: IMPIX (가상 기업, 실습용)
  product: 전동식 워터펌프(EWP) A100(12V)·B200(24V)과 알루미늄 펌프 하우징
  site: HQ(본사 사업장, ERP 1000)
  plants:
    - P1 제1공장(주조·가공) — ERP 1100 / MES IMP1 — 다이캐스팅 4대, CNC 6대, 세척기 1대
    - P2 제2공장(조립·검사) — ERP 1200 / MES IMP2 — 조립기 2대, 누설시험기 2대, 비전검사기 1대, 포장기 1대
  flow: 하우징 주조(P100) → CNC 가공(P200) → 세척·외관(P300) → 조립(A100) → 누설시험(A200) → 최종검사(A300) → 포장(A400)
  systems:
    - ERP(impix_erp.erp) — 기준정보·제조오더 + 영업(수요예측·판매계획·수주·출하)·구매·입고·재고·원가. FK 일부 선언
    - MES(impix_mes.mes) — LOT·착공·완공·설비·파라미터·품질. FK 미선언, 일시 문자열, 상태 하드코딩
    - QMS(impix_qms.qms) — 고객 클레임·수입검사·협력업체 부적합(CAR)·폐기·품질비용(Q-COST)
  period: "MES·QMS 2026-09-21 ~ 10-20, ERP 영업·구매·재고 2026-08-01 ~ 10-20 (일요일 휴무), 제조오더는 10-25까지. KPI 기준 일시 2026-10-20 17:00"
  approval: 시나리오별 대상 명사 목록을 도메인(PI) 컨설턴트·고객사 현업 검수자가 승인(S1 완료 기준)

scenarios:
  SC01:
    purpose: ERP·MES에 흩어진 기준정보(회사·공장·라인·품목·BOM·라우팅·공정·설비·코드)를 표준 명사로 일원화한다.
    flow: [ERP 기준정보 등록·변경, MES 동기화(품목 사본·공정·설비), 코드·단위 대응표 확정, 표준 원장 적재]
    scope: 사용(use_yn=Y) 기준정보 + 단종 품목은 이력 보존용으로 포함
    kpi: [기준정보 불일치 건수, 중복·고아 코드 0건, 단위 표준화율]
  SC02:
    purpose: 제조오더에서 LOT 생성, 공정별 착공·완공, 생산실적까지의 흐름을 추적해 진행·납기를 판단한다.
    flow: [ERP 제조오더 확정(MO_STAT 20), MES LOT 생성(하우징 → 조립 LOT 소비), 공정별 착공·완공, 일별 실적 집계 → ERP 반영]
    scope: 2026-09-21 ~ 10-20 제조오더와 LOT 전체
    kpi: [오더 달성률, 공정 대기시간]
  SC03:
    purpose: 설비 파라미터 수집값을 규격·관리한계로 검증하고 LOT·품질과 연결해 이상 원인을 찾는다.
    flow: [파라미터 정의(규격 LSL/USL, 관리한계 LCL/UCL), 10분 주기 수집, 규격 판정(검증결과코드), LOT 연결(시간 구간)]
    scope: 사용 설비 17대의 파라미터 31종, 30일
    kpi: [규격 이탈 건수, 수집 누락률, 이상 탐지 리드타임]
  SC04:
    purpose: 설비 상태 변경과 알람으로 가동률·고장·보전을 관리하고 고장 징후를 미리 잡는다.
    flow: [상태 변경(가동·대기·고장·보전·비가동), 알람 발생·해제, 고장 조치, 계획보전(토요일)]
    scope: 사용 설비 17대, 30일
    kpi: [미해제 알람 수, 고장 징후 선행 탐지 시간]
  SC05:
    purpose: 공정검사·누설검사·최종검사 실적과 불량 유형을 표준화해 불량률을 관리하고 근본 원인을 추적한다.
    flow: [공정검사(P200·P300), 누설검사(A200), 최종검사(A300), 불량 유형 기록, 보류·판정]
    scope: 검사 실적 전체, 불량 코드 9종
    kpi: [보류 LOT 수]
  SC06:
    purpose: 고객 클레임·수입검사·협력업체 부적합과 품질비용을 표준 명사로 연결해 고객 품질 리스크와 협력사 관리 우선순위를 판단한다.
    flow: [고객 클레임 접수(부적합·라인 중단·필드 반송), LOT 추적(출하 → 완제품 → 하우징 → 주조 설비), 대책서 회신(기한 관리), 수입검사(시료·판정), 협력업체 부적합·시정조치(CAR), 폐기·Q-COST 월 집계]
    scope: 2026-08 ~ 10월 클레임 7건, 수입검사 109건, 협력업체 부적합 5건, 폐기 361건, Q-COST 3개월
    kpi: [CAR 완료 지연 건수]
  SC07:
    purpose: 수요예측·판매계획(Sales), 생산계획·자재(Production), 재고(Inventory)를 한 흐름(PSI)으로 보고 고객 납기·품절을 관리한다.
    flow: [월 수요예측·판매계획 수립, 수주 접수(요청 납기), 일 생산계획·제조오더, 착수 전 자재 가용성 점검, 구매발주·입고, 생산입고, 출하(선입선출 LOT), 재고 실사·조정]
    scope: 2026-08-01 ~ 10-20 수주 161건, 출하 304건, 발주 166건, 일 재고 1,701건, 9월 말 실사
    kpi: [납기 지연 일수]

