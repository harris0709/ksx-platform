types: [조회, 집계, 추적, 진단, 판단, 요약]

questions:
  # ---------------- SC01 생산 기준정보 동기화 ----------------
  - { id: Q-SC01-01, sc: SC01, type: 조회, q: "EWP-A100의 현재 유효한 BOM 버전과 자품목 목록은?", criteria: "valid_fr ≤ 기준일 ≤ valid_to 인 BOM 라인", nouns: [BOMHeader, BOMLine, ItemMaster], answer: "버전 002(2026-07-01~), 자품목 9종(하우징·임펠러·모터·PCB·씰·O-링 2·볼트 4·커넥터·포장박스 0.1)" }
  - { id: Q-SC01-02, sc: SC01, type: 조회, q: "하우징 A100의 공정 순서와 공정별 표준 작업시간은?", criteria: "라우팅 공정순번 순, 개당 작업시간(초)", nouns: [RoutingHeader, RoutingLine, Operation], answer: "주조 45초 → CNC 95초 → 세척 20초" }
  - { id: Q-SC01-03, sc: SC01, type: 조회, q: "CNC 가공 공정에 배정된 사용 중 설비와 대수는?", criteria: "공정설비(공정 P200, 사용여부 Y)", nouns: [OperationEquipment, Equipment, Operation], answer: "CNC-01~06 6대(CNC-06 사용여부 값 '1' 정규화 필요)" }
