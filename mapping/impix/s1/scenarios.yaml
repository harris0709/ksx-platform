  - { id: Q-SC01-09, sc: SC01, type: 진단, q: "단종(사용 중지) 품목이 BOM·라우팅에 남아 있는가?", criteria: "UseIndicator=N 품목의 BOM·라우팅 참조", nouns: [ItemMaster, BOMLine, RoutingHeader] }
