  - { id: Q-SC01-05, sc: SC01, type: 집계, q: "품목유형별(제품·반제품·원자재·부자재·포장재·소모품) 사용 품목 수는?", criteria: "ItemType 표준 코드로 대응 후 집계(시험·중복 품목 제외)", nouns: [ItemMaster, CommonCodeMaster] }
