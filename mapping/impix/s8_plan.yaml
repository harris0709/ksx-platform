# S8 속성 그래프·벡터 인덱스 계획 — IMPIX (구현안내서 11장)
#   관리자(postgres)로 속성 그래프 스키마를 먼저 적용(라벨·인덱스·서비스 계정 권한, 다시 실행 가능):
#     docker compose exec -T postgres psql -U postgres -d ksx -v ON_ERROR_STOP=1 < ../../ontologies/graph/age_schema.sql
#   export S5_PLAN=mapping/impix/s8_plan.yaml
#   docker compose --profile tools run --rm -e S5_PLAN s5-tools sync          # AGE 차이 반영 + 정합 + 벡터 색인 + 검색 평가 → S8_동기화결과.md
#   docker compose --profile tools run --rm -e S5_PLAN s5-tools sync --eval   # 검색 평가만
#   docker compose --profile tools run --rm -e S5_PLAN s5-tools search --collection documents "금형온도 상한 초과 조치"
base: mapping/impix/s7_plan.yaml     # s7 → s6 → s5: 원장·Fuseki·기업·그래프 설정을 물려받는다

sync:
  graph: ksx_graph                   # Apache AGE 그래프(ksxgen.yaml graph, S4 D-4)
  site: HQ
  qdrant: "${QDRANT_URL:-http://localhost:6333}"
  qdrant_key: "${QDRANT_API_KEY:-}"
  embed: "${EMBED_URL:-http://localhost:8082}"   # TEI 호환 임베딩 서버(POST /embed) — compose 서비스 embed
  model: BAAI/bge-m3                 # 한·영 다국어(구현안내서 표 5 스택), 1024차원
  dim: 1024
  batch: 16
  catalog: ontologies/catalog/nouns  # 명사 카드(S4)
  collections:
    nodes:                           # 주요 개체 = 자기 이름·설명이 있는 개체(품목·설비·공정·부서·거래처·파라미터 …)
      include: []                    # 이름이 없어도 넣을 명사
      exclude: []
    cases:                           # 원인–조치 이력(고객 클레임, 공급사 시정조치)
      nouns: [CustomerComplaint, CorrectiveActionRequest]
      related: [CorrectiveActionPlan, CorrectiveActionResult]   # 이 이력을 가리키는 계획·결과도 문장에 넣는다
      approved:                      # payload approved = Y 조건(종결된 이력)
        CustomerComplaint: {customerComplaintStatusCode: [CLOSED]}
        CorrectiveActionRequest: {related: CorrectiveActionResult}
    documents:
      dir: mapping/impix/sop         # SOP·규정(머리말 doc_id·version·status·links) — README 참조
      chunk: [500, 800]
  terms: {}                          # 명사 카드 업무 용어(D-1) — 자동 수집에 더해 현업이 넣는 말. 예) Personnel: [퇴직자]
  terms_max_values: 40               # 참조 개체 이름·코드 레이블이 이보다 많으면 넣지 않는다(품목명 수백 개 등)
  terms_max_cards: 3                 # 이보다 많은 카드에 두루 붙는 말(사업장·공장·품목명)은 명사를 가르지 못하므로 뺀다
  checks:                            # 탐색 확인(cypher) — 서비스 계정 세션, 다단 경로
    - id: G01
      desc: "로트 계보(추론 관계 derivedFrom) — 완제품 E261003A1의 원재료 LOT"
      cypher: "MATCH (l:Lot {lotID: 'E261003A1'})-[:derivedFrom]->(a:Lot) RETURN a.lotID"
      expected: [H261003A1]
    - id: G02
      desc: "스펙아웃 하우징 LOT → 그 LOT으로 만든 완제품 LOT(추론 이벤트 + 계보 2단)"
      cypher: "MATCH (e:SpecOutLotEvent)-[:onLot]->(h:Lot)<-[:derivedFrom]-(f:Lot) RETURN DISTINCT f.lotID"
      expected: [E261003A1, E261005A1, E261006A1, E261007A1]
    - id: G03
      desc: "납기 리스크 이벤트(R-100) → 수주"
      cypher: "MATCH (e:OTDRiskEvent)-[:onSalesOrderLine]->(s) RETURN DISTINCT s.salesDocumentNumber"
      expected: [SO260926001, SO260928001, SO260929001, SO260930001]
    - id: G04
      desc: "BOM 다단 전개(추론 component) — EWP-B200"
      cypher: "MATCH (p:ItemMaster {itemID: 'EWP-B200'})-[:component]->(c:ItemMaster) RETURN c.itemID"
      expected: [ALDC12, BLT-M5X16, BOX-EWP, HSG-B200, IMP-B200, MTR-24V, ORG-45, PCB-EWP24, SEAL-M18]
    - id: G05
      desc: "가변 길이 경로(표준 관계 refParentDepartment*1..5) — 주조가공팀의 상위 부서"
      cypher: "MATCH (d:Department {departmentID: 'D110'})-[:refParentDepartment*1..5]->(p:Department) RETURN p.departmentID"
      expected: [D100]

# 검색 평가(완료 기준 ≥ 0.9, 컬렉션마다). recall@k = 상위 k(문서는 문서 단위)에 든 정답 ÷ min(정답 수, k), 적중@k = 정답이 하나라도 들었나.
#   noun_cards: S1 업무 질의서(mapping/impix/s1/S1_업무질의서_IMPIX.xlsx)의 질문 → '필요 명사'(헤더·라인은 명사 카드 하나로)
#   nodes: 업무 질의·현장 표현에 나오는 개체 이름 → 개체(라벨:식별값)
#   cases: 증상 표현 → 클레임·시정조치 번호
#   documents: 현장 질문 → 문서 번호. must_not = 나오면 안 되는 판(폐기) — 현행 필터 확인
search_eval:
  k: 5
  threshold: 0.9
  metric: {noun_cards: hit}          # D-1: 명사 카드는 출발점 명사 적중@5, 필요한 명사 전부(recall)는 S9 GraphRAG 평가 — 나머지는 recall@5
  cases:
    - {id: N-SC01-01, collection: noun_cards, source: Q-SC01-01, query: "EWP-A100의 현재 유효한 BOM 버전과 자품목 목록은?", expected: ["BOM", "ItemMaster"]}
    - {id: N-SC01-02, collection: noun_cards, source: Q-SC01-02, query: "하우징 A100의 공정 순서와 공정별 표준 작업시간은?", expected: ["Routing", "Operation"]}
    - {id: N-SC01-03, collection: noun_cards, source: Q-SC01-03, query: "CNC 가공 공정에 배정된 사용 중 설비와 대수는?", expected: ["OperationEquipment", "Equipment", "Operation"]}
    - {id: N-SC01-04, collection: noun_cards, source: Q-SC01-04, query: "사용 중인 다이캐스팅기 목록과 제조사·도입일은?", expected: ["Equipment"]}
    - {id: N-SC01-05, collection: noun_cards, source: Q-SC01-05, query: "품목유형별(제품·반제품·원자재·부자재·포장재·소모품) 사용 품목 수는?", expected: ["ItemMaster", "CommonCodeMaster"]}
    - {id: N-SC01-06, collection: noun_cards, source: Q-SC01-06, query: "ERP 품목과 MES 품목 사본의 이름·단위가 다른 품목은?", expected: ["ItemMaster"]}
    - {id: N-SC01-07, collection: noun_cards, source: Q-SC01-07, query: "공장별 생산라인과 일 표준 생산능력은?", expected: ["Plant", "Line"]}
    - {id: N-SC01-08, collection: noun_cards, source: Q-SC01-08, query: "EWP-B200 1대 생산에 필요한 알루미늄 잉곳(ALDC12) 양은?", expected: ["BOM", "ItemMaster"]}
    - {id: N-SC01-09, collection: noun_cards, source: Q-SC01-09, query: "단종(사용 중지) 품목이 BOM·라우팅에 남아 있는가?", expected: ["ItemMaster", "BOM", "Routing"]}
    - {id: N-SC01-10, collection: noun_cards, source: Q-SC01-10, query: "품목마스터에 없는 자품목을 쓰는 BOM 라인은?", expected: ["BOM", "ItemMaster"]}
    - {id: N-SC01-11, collection: noun_cards, source: Q-SC01-11, query: "대소문자나 공백만 다른 중복 품목코드는?", expected: ["ItemMaster"]}
    - {id: N-SC01-12, collection: noun_cards, source: Q-SC01-12, query: "설비별 관리자와 소속 부서는?", expected: ["Equipment", "Personnel", "Department"]}
    - {id: N-SC01-13, collection: noun_cards, source: Q-SC01-13, query: "LOT 관리 대상 품목은?", expected: ["ItemMaster"]}
    - {id: N-SC01-14, collection: noun_cards, source: Q-SC01-14, query: "수입검사 대상 부품 목록은?", expected: ["ItemMaster"]}
    - {id: N-SC01-15, collection: noun_cards, source: Q-SC01-15, query: "MES 공정 코드와 ERP 작업장 코드의 대응은?", expected: ["Operation"]}
    - {id: N-SC01-16, collection: noun_cards, source: Q-SC01-16, query: "기준단위가 표준(EA·KG·L)과 다르게 등록된 품목은?", expected: ["ItemMaster", "UOMGroup"]}
    - {id: N-SC01-17, collection: noun_cards, source: Q-SC01-17, query: "각 공정의 공정유형(생산·검사·포장)은?", expected: ["Operation", "CommonCodeMaster"]}
    - {id: N-SC01-18, collection: noun_cards, source: Q-SC01-18, query: "퇴직자가 설비 관리자나 작업자로 남아 있는가?", expected: ["Personnel", "Equipment", "OperationStart"]}
    - {id: N-SC01-19, collection: noun_cards, source: Q-SC01-19, query: "EWP-A100 BOM이 001에서 002로 바뀌며 추가된 자품목은?", expected: ["BOM"]}
    - {id: N-SC01-20, collection: noun_cards, source: Q-SC01-20, query: "ERP·MES 공장 코드를 표준 공장 ID로 대응하면?", expected: ["Plant"]}
    - {id: N-SC02-01, collection: noun_cards, source: Q-SC02-01, query: "지금(10-20 기준) 진행 중인 LOT과 다음 공정은?", expected: ["Lot", "Operation"]}
    - {id: N-SC02-02, collection: noun_cards, source: Q-SC02-02, query: "제조오더 MO261005001의 LOT별 진행과 누적 양품은?", expected: ["ProductionOrder", "Lot", "OperationEnd"]}
    - {id: N-SC02-03, collection: noun_cards, source: Q-SC02-03, query: "10-05~10-10 일별 EWP-A100 완성(포장 완공) 수량은?", expected: ["OperationEnd", "ProductionPerformance"]}
    - {id: N-SC02-04, collection: noun_cards, source: Q-SC02-04, query: "납기 안에 완료되지 못했거나 위험한 제조오더는?", expected: ["ProductionOrder", "Lot", "OperationEnd"]}
    - {id: N-SC02-05, collection: noun_cards, source: Q-SC02-05, query: "공정별 평균 처리시간(착공~완공)과 표준시간 대비 편차는?", expected: ["OperationStart", "OperationEnd", "Routing"]}
    - {id: N-SC02-06, collection: noun_cards, source: Q-SC02-06, query: "완제품 LOT E261007A1에 들어간 하우징 LOT과 주조 설비는?", expected: ["Lot", "OperationStart", "Equipment"]}
    - {id: N-SC02-07, collection: noun_cards, source: Q-SC02-07, query: "보류된 LOT과 보류 직전 공정의 불량률은?", expected: ["Lot", "OperationEnd", "ProductionPerformanceQuality"]}
    - {id: N-SC02-08, collection: noun_cards, source: Q-SC02-08, query: "작업자별 10월 처리 LOT 수는?", expected: ["OperationStart", "Personnel"]}
    - {id: N-SC02-09, collection: noun_cards, source: Q-SC02-09, query: "제조오더별 지시 수량 대비 완성 수량 달성률은?", expected: ["ProductionOrder", "OperationEnd"]}
    - {id: N-SC02-10, collection: noun_cards, source: Q-SC02-10, query: "착공은 있는데 완공이 없는 공정 이력은?", expected: ["OperationStart", "OperationEnd"]}
    - {id: N-SC02-11, collection: noun_cards, source: Q-SC02-11, query: "완공 시각이 착공보다 빠른 등 시간 오류가 있는 이력은?", expected: ["OperationStart", "OperationEnd"]}
    - {id: N-SC02-12, collection: noun_cards, source: Q-SC02-12, query: "투입 수량과 양품+불량이 맞지 않는 완공 실적은?", expected: ["OperationStart", "OperationEnd"]}
    - {id: N-SC02-13, collection: noun_cards, source: Q-SC02-13, query: "ERP에 없는 제조오더 번호를 가진 LOT은?", expected: ["Lot", "ProductionOrder"]}
    - {id: N-SC02-14, collection: noun_cards, source: Q-SC02-14, query: "B200 라인(AL02)의 일 평균 생산량과 표준능력 대비 비율은?", expected: ["Line", "OperationEnd", "ProductionPerformance"]}
    - {id: N-SC02-15, collection: noun_cards, source: Q-SC02-15, query: "공정 간 대기시간(이전 완공~다음 착공)이 가장 긴 구간은?", expected: ["OperationStart", "OperationEnd", "Routing"]}
    - {id: N-SC02-16, collection: noun_cards, source: Q-SC02-16, query: "설비별 10월 처리 LOT 수와 처리 수량은?", expected: ["OperationStart", "Equipment"]}
    - {id: N-SC02-17, collection: noun_cards, source: Q-SC02-17, query: "취소된 제조오더 MO260930002에 연결된 LOT은 어떻게 처리됐나?", expected: ["ProductionOrder", "Lot"]}
    - {id: N-SC02-18, collection: noun_cards, source: Q-SC02-18, query: "하우징 LOT 200EA가 최종 포장까지 가는 평균 수율은?", expected: ["Lot", "OperationEnd"]}
    - {id: N-SC02-19, collection: noun_cards, source: Q-SC02-19, query: "계획 시작일보다 첫 착공이 늦은 제조오더는?", expected: ["ProductionOrder", "OperationStart"]}
    - {id: N-SC02-20, collection: noun_cards, source: Q-SC02-20, query: "확정 상태로 착수 대기 중인 제조오더와 수량은?", expected: ["ProductionOrder"]}
