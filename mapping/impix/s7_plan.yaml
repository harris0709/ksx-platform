# S7 규칙 추론 계획 — IMPIX (구현안내서 10장)
#   export S5_PLAN=mapping/impix/s7_plan.yaml
#   docker compose --profile tools run --rm -e S5_PLAN s5-tools infer          # 규칙 실행 + 정확도 평가 → S7_추론결과.md
#   docker compose --profile tools run --rm -e S5_PLAN s5-tools infer --eval   # 평가만(현재 추론 결과)
base: mapping/impix/s6_plan.yaml     # s6 → s5: 원장·Fuseki·기업·그래프, 위반 표식 설정을 물려받는다

infer:
  rules: ontologies/rules            # A-*(자동 전이) → R-*(업무 규칙) 파일명 순. 파라미터는 rules/params.yaml
  today: "2026-10-20"                # 기준일 — IMPIX KPI 기준 일시(2026-10-20 17:00)와 같은 날. 운영에서는 비우면 오늘
  site: HQ                           # 결과 그래프 graph/inferred/IMPIX/HQ/{규칙 ID}
  batch_target_seconds: 600          # 야간 배치 목표(완료 기준) — 규칙 전체 실행 시간
  thresholds: {precision: 0.9, recall: 0.95}   # 완료 기준(표 25) — 규칙마다

# 정확도 평가 — 정답(수작업 판정)은 S1 업무 질의서의 답(question)과 원천 DB 직접 조회(mapping/impix/s7_answers.sql)로 만들었다.
