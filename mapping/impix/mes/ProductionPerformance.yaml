# ProductionPerformance ← mes.tb_trk_out (N→1(완공+착공+LOT+검사)) — automap 생성, 계획: s2_plan.yaml
# 상태: draft(자동) → reviewed(데이터 엔지니어) → approved(도메인·현업)
noun: ProductionPerformance
layer: core
structure: N→1(완공+착공+LOT+검사)
source: {system: MES, table: mes.tb_trk_out}
join:
- {table: mes.tb_trk_in, as: i, 'on': trk_in_id = i.trk_in_id}
- {table: mes.tb_lot, as: l, 'on': lot_no = l.lot_no}
- {table: mes.tb_qc_insp, as: q, 'on': lot_no = q.lot_no AND proc_cd = q.proc_cd}
base: {EnterpriseID: const(IMPIX), SiteID: const(HQ), PlantID: 'xref(plant, i.fac_id)'}
identity:
- ProductionPerformanceID
- ProductionPerformanceSequence
attributes:
  ProductionPerformanceID: {from: trk_out_id, match: manual, transform: 'concat(''PP-'',trk_out_id)', status: approved}
  ProductionPerformanceSequence: {match: const, transform: const(1), status: approved}
  LotID: {from: lot_no, match: normalized, status: approved}
  OperationID: {from: proc_cd, match: normalized, status: approved}
  ItemID: {from: l.item_cd, match: normalized, transform: upper_trim(l.item_cd), status: approved}
  ProductionOrderID: {from: l.mo_no, match: normalized, status: approved}
  ProductionOrderSequence: {from: l.mo_seq, match: normalized, status: approved}
  ExecutionStartDateTime: {from: i.trk_in_dtm, match: manual, transform: to_ts14(i.trk_in_dtm), status: approved}
  ExecutionEndDateTime: {from: trk_out_dtm, match: manual, transform: to_ts14(trk_out_dtm), status: approved}
  ProductionPerformanceDate: {from: trk_out_dtm, match: manual, transform: to_date(to_ts14(trk_out_dtm)), status: approved}
  PersonnelID: {from: oper_emp_no, match: component, status: approved}
  ProducedQuantity: {from: good_qty, match: normalized, status: approved}
  DefectQuantity: {from: ng_qty, match: normalized, status: approved}
extension:
  InspectionResult: {from: q.judge, match: manual, code: QC_JUDGE -> InspectionResult, status: approved}
  InspectionQuantity: {from: q.insp_qty, match: normalized, status: approved}
excluded:
- {column: eqp_id, reason: 설비 — ProductionPerformanceEquipment에서 매핑}
