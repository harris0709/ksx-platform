# OperationEnd ← mes.tb_trk_out (이력→이벤트) — automap 생성, 계획: s2_plan.yaml
# 상태: draft(자동) → reviewed(데이터 엔지니어) → approved(도메인·현업)
noun: OperationEnd
layer: core
structure: 이력→이벤트
source: {system: MES, table: mes.tb_trk_out}
join:
- {table: mes.tb_trk_in, as: i, 'on': trk_in_id = i.trk_in_id}
base: {EnterpriseID: const(IMPIX), SiteID: const(HQ), PlantID: 'xref(plant, i.fac_id)'}
identity:
- OperationEndID
attributes:
  OperationEndID: {from: trk_out_id, match: manual, transform: 'concat(''TO-'',trk_out_id)', status: reviewed}
  LotID: {from: lot_no, match: normalized, status: reviewed}
  OperationEndTime: {from: trk_out_dtm, match: manual, transform: to_ts14(trk_out_dtm), status: reviewed}
  PersonnelID: {from: oper_emp_no, match: component, status: reviewed}
  OperationID: {from: proc_cd, match: normalized, status: reviewed}
  EquipmentID: {from: eqp_id, match: normalized, status: reviewed}
  ProducedQuantity: {from: good_qty, match: normalized, status: reviewed}
  DefectQuantity: {from: ng_qty, match: normalized, status: reviewed}
extension: {}
excluded: []
