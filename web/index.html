<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>KSX 온톨로지 콘솔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 상단 콘솔 바 + (명사 목록 | 명사 상세) 2단, 좁은 화면에서는 1단 */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#18222b; --muted:#5d6b77; --line:#d9e0e5;
  --accent:#0d6b6b; --accent-soft:#e2f0ef; --chip:#eef2f4;
  --good:#1f7a3f; --warn:#a15c00; --bad:#b4232a;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --panel:#162027; --ink:#e3eaee; --muted:#93a3ae; --line:#2a3741;
  --accent:#5cc2b8; --accent-soft:#16312f; --chip:#1d2a32; --good:#5fc47e; --warn:#e0a24a; --bad:#ef6b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --panel:#162027; --ink:#e3eaee; --muted:#93a3ae; --line:#2a3741;
  --accent:#5cc2b8; --accent-soft:#16312f; --chip:#1d2a32; --good:#5fc47e; --warn:#e0a24a; --bad:#ef6b6f; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
header.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand .ver{font-family:var(--mono);font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{font:inherit;font-weight:500;background:transparent;color:var(--muted);border:1px solid transparent;border-radius:6px;padding:6px 12px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);border-color:var(--line)}
nav.tabs button:focus-visible,.nlist button:focus-visible,.node:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;margin-top:18px}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 140px);position:sticky;top:12px}
@media (max-width:860px){aside{position:static;max-height:340px}}
aside .search{padding:12px;border-bottom:1px solid var(--line)}
aside input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.nlist{overflow:auto;padding:6px 6px 10px}
.grp{font-size:11.5px;letter-spacing:.06em;color:var(--muted);padding:10px 8px 4px;font-weight:600}
.nlist button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;font:inherit;background:none;border:0;border-radius:6px;padding:6px 8px;color:var(--ink);cursor:pointer}
.nlist button:hover{background:var(--chip)}
.nlist button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nlist .en{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.head h2{margin:0;font-size:24px;letter-spacing:-.01em;text-wrap:balance}
.head .cls{font-family:var(--mono);color:var(--accent);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12px;background:var(--chip);border-radius:999px;padding:3px 10px;color:var(--muted)}
.pill.struct{background:var(--accent-soft);color:var(--accent);font-weight:600}
.def{margin:12px 0 0;max-width:68ch}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin-top:14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
h3{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--panel);position:sticky;top:0}
td.m{font-family:var(--mono);font-size:12px}
.t{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--chip);white-space:nowrap}
.t.IDREF{color:var(--accent)} .t.enum{color:var(--warn)} .t.ID{color:var(--good);font-weight:600}
.copy{font-size:11.5px;color:var(--warn)}
a.go{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500} a.go:hover{text-decoration:underline}
.graph svg{width:100%;height:auto;display:block}
.node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.node.center rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.node text{fill:var(--ink);font-size:12.5px;font-family:var(--sans)}
.node .sub{fill:var(--muted);font-size:10.5px;font-family:var(--mono)}
.node{cursor:pointer} .node:hover rect{stroke:var(--accent)}
.edge{stroke:var(--line);stroke-width:1.3;fill:none}
.elab{fill:var(--muted);font-size:10.5px;font-family:var(--mono)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat div{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.ok{color:var(--good);font-weight:600} .ng{color:var(--bad);font-weight:600}
pre{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;overflow-x:auto;margin:0;line-height:1.5}
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--mono);font-size:12px}
.flow span{background:var(--chip);border-radius:4px;padding:3px 8px}
.flow i{color:var(--muted);font-style:normal}
</style>
</head>
<body>

<div class="wrap">
  <header class="bar">
    <div class="brand"><h1>KSX 온톨로지 콘솔</h1><span class="ver">KS X 9101-1 v1.0 · ksxgen 0.1</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-nouns" aria-selected="true" data-view="nouns">명사 브라우저</button>
      <button role="tab" id="tab-conf" aria-selected="false" data-view="conf">적합성 검증</button>
      <button role="tab" id="tab-infer" aria-selected="false" data-view="infer">추론 결과</button>
    </nav>
  </header>
  <p class="note">harris0709/ksx-platform의 생성물(명사 카드 68개)과 E2E 시험 결과로 만든 화면 시안입니다. 추론 결과 탭의 데이터는 시험용 시드(가상 공장 ACME)이며 실제 고객 데이터가 아닙니다.</p>

  <section id="v-nouns" class="grid">
    <aside>
      <div class="search"><label for="q" class="grp" style="padding:0 0 6px;display:block">명사 검색(국문·영문·속성)</label><input id="q" type="search" placeholder="예: 로트, BOM, LotState"></div>
      <div class="nlist" id="list"></div>
    </aside>
    <main id="detail"></main>
  </section>

  <section id="v-conf" hidden></section>
  <section id="v-infer" hidden></section>
</div>

<script src="data/nouns.js"></script>
<script>
const byNoun=Object.fromEntries(NOUNS.map(n=>[n.noun,n]));
const lineToNoun={}; NOUNS.forEach(n=>{ if(n.struct) lineToNoun[n.struct.line]=n.noun; });
const nounOf=c=>lineToNoun[c]||c;
const incoming={}; NOUNS.forEach(n=>n.refs.forEach(r=>{const t=nounOf(r[1]); (incoming[t]=incoming[t]||[]).push([n.noun,r[2],r[0]]);}));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AREA_ORDER=['기준정보','생산관리','자재관리','구매관리','판매관리','재고관리','창고관리','프로젝트관리','서비스관리'];
let current='Lot';

function renderList(q=''){
  q=q.trim().toLowerCase();
  const hit=n=>!q||n.ko.toLowerCase().includes(q)||n.noun.toLowerCase().includes(q)||n.attrs.some(a=>a[0].toLowerCase().includes(q)||a[1].includes(q));
  let h='';
  AREA_ORDER.forEach(area=>{
    const items=NOUNS.filter(n=>n.area===area&&hit(n)).sort((a,b)=>a.ko.localeCompare(b.ko,'ko'));
    if(!items.length) return;
    h+=`<div class="grp">${esc(area)} · ${items.length}</div>`;
    items.forEach(n=>h+=`<button data-n="${n.noun}" aria-current="${n.noun===current}"><span>${esc(n.ko)}</span><span class="en">${esc(n.noun)}</span></button>`);
  });
  document.getElementById('list').innerHTML=h||'<p class="note" style="padding:8px">일치하는 명사가 없습니다.</p>';
}

function graphSVG(n){
  const outs=[...new Map(n.refs.map(r=>[nounOf(r[1])+'|'+r[2],[nounOf(r[1]),r[2]]])).values()];
  const ins=[...new Map((incoming[n.noun]||[]).map(r=>[r[0]+'|'+r[1],r])).values()];
  const moreOut=Math.max(0,outs.length-12), moreIn=Math.max(0,ins.length-12); outs.splice(12); ins.splice(12);
  const W=760, rowH=34, maxRows=Math.max(outs.length,ins.length,1), H=Math.max(140,maxRows*rowH+40);
  const cx=W/2, cy=H/2, bw=150, bh=26;
  let e='',nodes='';
  const node=(x,y,name,sub,center)=>`<g class="node${center?' center':''}" tabindex="0" role="button" data-n="${name}" aria-label="${esc(byNoun[name]?.ko||name)}"><rect x="${x-bw/2}" y="${y-bh/2}" width="${bw}" height="${bh}" rx="6"/><text x="${x}" y="${y+4}" text-anchor="middle">${esc((byNoun[name]?.ko||name).slice(0,12))}</text></g>`;
  const col=(arr,x,dir)=>arr.forEach((r,i)=>{
    const y=20+rowH/2+i*rowH+(H-40-arr.length*rowH)/2;
    const x1=dir>0?cx+bw/2:x+bw/2, x2=dir>0?x-bw/2:cx-bw/2;
    const ya=dir>0?cy:y, yb=dir>0?y:cy;
    e+=`<path class="edge" d="M${x1} ${ya} C${(x1+x2)/2} ${ya}, ${(x1+x2)/2} ${yb}, ${x2} ${yb}" marker-end="url(#ah)"/>`;
    nodes+=node(x,y,dir>0?r[0]:r[0]);
    e+=`<text class="elab" x="${dir>0?x-bw/2-4:x+bw/2+4}" y="${y-8}" text-anchor="${dir>0?'end':'start'}">${esc(r[1])}</text>`;
  });
  col(ins,95,-1); col(outs,W-95,1);
  nodes+=node(cx,cy,n.noun,'',true);
  if(moreIn) nodes+=`<text class="elab" x="95" y="${H-6}" text-anchor="middle">외 ${moreIn}개 (아래 표 참고)</text>`;
  if(moreOut) nodes+=`<text class="elab" x="${W-95}" y="${H-6}" text-anchor="middle">외 ${moreOut}개</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(n.ko)} 참조 관계"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" style="color:var(--muted)"/></marker></defs>${e}${nodes}</svg>`;
}

function renderDetail(){
  const n=byNoun[current]; if(!n) return;
  const tables=Object.entries(n.physical).map(([t,v])=>`${t} (UK: ${v.uk.join(' + ')})`).join('\n');
  const rows=n.attrs.map(a=>`<tr><td>${esc(a[1])}</td><td class="m">${esc(a[0])}</td><td><span class="t ${a[2]}">${esc(a[2])}</span></td><td class="m">ksx:${esc(a[3])}</td><td>${a[4]?`<span class="copy">사본 ← ${esc(a[4])}</span>`:''}${n.struct?`<span class="note" style="margin:0;font-size:11.5px">${a[5].endsWith('Line')?'라인':'헤더'}</span>`:''}</td></tr>`).join('');
  const refs=n.refs.map(r=>`<tr><td class="m">${esc(r[0])}</td><td class="m">ksx:${esc(r[2])}</td><td><a class="go" data-n="${nounOf(r[1])}">${esc(byNoun[nounOf(r[1])]?.ko||r[1])}</a> <span class="en m">${esc(r[1])}</span></td></tr>`).join('');
  const inc=(incoming[n.noun]||[]).map(r=>`<tr><td><a class="go" data-n="${r[0]}">${esc(byNoun[r[0]].ko)}</a></td><td class="m">ksx:${esc(r[1])}</td><td class="m">${esc(r[2])}</td></tr>`).join('');
  const sample=`PREFIX ksx: <https://ontology.impix.co.kr/ksx9101/1.0/>\nSELECT ?s ?id WHERE {\n  ?s a ksx:${n.noun} ;\n     ksx:${n.attrs.find(a=>n.identity.includes(a[0]))?.[3]||'enterpriseID'} ?id .\n} LIMIT 20`;
  document.getElementById('detail').innerHTML=`
  <div class="card">
    <div class="head"><h2>${esc(n.ko)}</h2><span class="cls">ksx:${esc(n.noun)}</span></div>
    <div class="meta"><span class="pill">${esc(n.area)}</span><span class="pill">${esc(n.clause)} · ${esc(n.table)}</span><span class="pill">속성 ${n.attrs.length}</span><span class="pill">참조 ${n.refs.length} · 피참조 ${(incoming[n.noun]||[]).length}</span>${n.struct?`<span class="pill struct">헤더·라인 구조체 · ${esc(n.struct.line)}</span>`:''}</div>
    <p class="def">${esc(n.definition)}</p>
    <dl class="kv"><dt>식별 속성</dt><dd>${esc(n.identity.join(' + '))}${n.struct?` · 라인 키 ${esc(n.struct.lineKey.join(' + '))}`:''}</dd><dt>물리 테이블</dt><dd style="white-space:pre-line">${esc(tables)}</dd><dt>IRI 예</dt><dd>https://data.impix.co.kr/ACME/${esc(n.noun)}/{${esc(n.identity.join('}_{'))}}</dd>${n.codes.length?`<dt>코드 그룹</dt><dd>${esc(n.codes.map(c=>c[1]).join(', '))}</dd>`:''}</dl>
  </div>
  <div class="card graph"><h3>참조 관계 · 왼쪽 = 이 명사를 참조, 오른쪽 = 이 명사가 참조</h3>${graphSVG(n)}<div class="legend"><span>노드를 누르면 해당 명사로 이동</span><span>기본 속성(회사·사업장·공장·등록자·수정자) 참조는 생략</span></div></div>
  <div class="card"><h3>명사 속성 · 기본 속성 제외</h3><div class="scroll" style="max-height:480px"><table><thead><tr><th>국문</th><th>영문</th><th>타입</th><th>온톨로지 속성</th><th>비고</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="two">
    <div class="card"><h3>참조 (이 명사 → 다른 명사)</h3><div class="scroll"><table><thead><tr><th>FK 컬럼</th><th>관계</th><th>대상</th></tr></thead><tbody>${refs||'<tr><td colspan="3" class="note">없음</td></tr>'}</tbody></table></div></div>
    <div class="card"><h3>피참조 (다른 명사 → 이 명사)</h3><div class="scroll"><table><thead><tr><th>명사</th><th>관계</th><th>FK 컬럼</th></tr></thead><tbody>${inc||'<tr><td colspan="3" class="note">없음</td></tr>'}</tbody></table></div></div>
  </div>
  <div class="card"><h3>SPARQL 예시 (Ontop 엔드포인트)</h3><pre>${esc(sample)}</pre></div>`;
}

function go(n){ if(!byNoun[n]) return; current=n; renderList(document.getElementById('q').value); renderDetail(); window.scrollTo({top:0,behavior:'smooth'}); }
document.addEventListener('click',e=>{const t=e.target.closest('[data-n]'); if(t) go(t.dataset.n);});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('node')){e.preventDefault(); go(e.target.dataset.n);} });
document.getElementById('q').addEventListener('input',e=>renderList(e.target.value));

// 적합성 검증 탭 (ksxgen 커버리지 + E2E 시험 결과)
document.getElementById('v-conf').innerHTML=`
<div class="card" style="margin-top:18px"><h3>생성물 커버리지 · report/coverage.md</h3>
 <div class="stat"><div><b>68 / 68</b><span>명사 → 클래스</span></div><div><b>8 / 8</b><span>헤더·라인 구조체</span></div><div><b>1,534 / 1,534</b><span>컬럼 → 속성(PK 제외)</span></div><div><b>609 / 609</b><span>물리 FK → 관계</span></div><div><b>79 · 568 · 47</b><span>코드 그룹 · 코드 · 단위</span></div><div><b class="ok">0</b><span>정의 충돌</span></div></div></div>
<div class="two" style="margin-top:16px">
 <div class="card"><h3>SHACL 적합성 · 시드 데이터</h3><p><span class="sev" style="background:var(--good)"></span><span class="ok">적합</span> — 트리플 177개, 셰이프 76개, 위반 0건</p><p class="note">회사 1 · 사업장 1 · 공장 1 · 사원 1 · 품목 2 · 로트 2 · 자재명세서 1(라인 2) · 수주 1 · 생산지시 1 · 생산실적 1</p></div>
 <div class="card"><h3>위반 주입 시험 · 3건 모두 검출</h3><div class="scroll"><table><thead><tr><th>대상</th><th>속성</th><th>위반</th></tr></thead><tbody>
  <tr><td class="m">BOM/BOM-A100_2</td><td class="m">ksx:hasLine</td><td><span class="sev" style="background:var(--bad)"></span>라인 없음(minCount 1)</td></tr>
  <tr><td class="m">Lot/LOT-0731</td><td class="m">ksx:producedQuantity</td><td><span class="sev" style="background:var(--bad)"></span>음수 수량(minInclusive 0)</td></tr>
  <tr><td class="m">Lot/LOT-0731</td><td class="m">ksx:refItem</td><td><span class="sev" style="background:var(--bad)"></span>대상 클래스 불일치(로트를 품목으로 참조)</td></tr>
 </tbody></table></div></div>
</div>
<div class="card" style="margin-top:16px"><h3>CI · GitHub Actions ontology-ci</h3><div class="flow"><span class="ok">✓ ksxgen check</span><i>→</i><span class="ok">✓ 생성기 회귀</span><i>→</i><span class="ok">✓ E2E: DDL → 시드 → OBDA → SHACL → 규칙</span></div></div>`;
