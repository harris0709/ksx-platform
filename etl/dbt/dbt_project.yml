# ksx-platform dbt 프로젝트 — S3 변환(구현안내서 6.3)
#   stg(원천 복제) → xfm(변환 뷰, 이 프로젝트) → ksx·ext(표준 원장, ksxload publish가 적재)
#   models/<기업>/ 와 seeds/<기업>/ 는 ksxload gen 생성물이다(직접 수정 금지).
#   실행: dbt seed → dbt run → dbt test   (profiles.yml은 이 폴더, 접속은 환경변수)
name: ksx
version: "1.0.0"
config-version: 2
profile: ksx

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

# 변환 어휘 SQL 함수(xfm.to_date8 등)를 먼저 만든다
on-run-start:
  - "{{ ksx_xfm_functions() }}"

models:
  ksx:
    +schema: xfm
    +materialized: view

seeds:
  ksx:
    +schema: xfm
