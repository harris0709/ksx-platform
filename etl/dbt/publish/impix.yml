- model: AvailableInventory
  noun: AvailableInventory
  spec: mapping/impix/erp/AvailableInventory.yaml
  kind: rows
  targets:
  - table: ksx.AvailableInventory
    columns:
    - EnterpriseID
    - SiteID
    - PlantID
    - AvailableInventoryID
    - ItemID
    - AvailableInventoryQuantity
  - table: ext.AvailableInventoryExt
    columns:
    - EnterpriseID
    - AvailableInventoryID
    - ProductionOrderID
    - ProductionOrderSequence
    - AvailabilityCheckDateTime
    - MaterialRequirementQuantity
    - ShortageQuantity
  uk:
  - EnterpriseID
  - AvailableInventoryID
  expect_sql: select count(*) from stg."erp__tb_pp_mat_chk" s
  sums:
  - column: AvailableInventoryQuantity
    source: select sum(s.avail_qty::numeric) from stg."erp__tb_pp_mat_chk" s
  - column: MaterialRequirementQuantity
    source: select sum(s.req_qty::numeric) from stg."erp__tb_pp_mat_chk" s
  - column: ShortageQuantity
    source: select sum(s.short_qty::numeric) from stg."erp__tb_pp_mat_chk" s
