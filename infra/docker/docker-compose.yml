# S0 개발 스택. 실행: docker compose -f infra/docker/docker-compose.yml --env-file .env up -d
# 이미지 버전은 고정값이다. 올릴 때는 이 파일만 바꾸고 tests/를 다시 통과시킨다.
name: ksx
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ksx
      POSTGRES_USER: ksx_admin
      POSTGRES_PASSWORD: ${KSX_DB_PASSWORD:?.env에 KSX_DB_PASSWORD 필요}
    ports: ["5432:5432"]
    volumes:
      - pg:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ../../ontologies/ddl/ksx.sql:/docker-entrypoint-initdb.d/10_ksx.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ksx_admin -d ksx"], interval: 5s, retries: 20 }

  fuseki:
    build: ./fuseki
    image: ksx/fuseki:5.2.0
    ports: ["3030:3030"]
    volumes: [fuseki:/fuseki/databases]

  ontop:
    image: ontop/ontop:5.1.2
    ports: ["8081:8080"]
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/onto/tbox/ksx9101_core.ttl
      ONTOP_MAPPING_FILE: /opt/onto/mappings/ksx9101.obda
      ONTOP_DB_URL: jdbc:postgresql://postgres:5432/ksx
      ONTOP_DB_DRIVER: org.postgresql.Driver
      ONTOP_DB_USER: ontop_ro
      ONTOP_DB_PASSWORD: ${ONTOP_DB_PASSWORD:?.env에 ONTOP_DB_PASSWORD 필요}
    volumes:
      - ../../ontologies:/opt/onto:ro
      - ./ontop/jdbc:/opt/ontop/jdbc:ro
    depends_on: { postgres: { condition: service_healthy } }

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?.env에 KEYCLOAK_ADMIN_PASSWORD 필요}
    ports: ["8080:8080"]
    volumes: [../keycloak:/opt/keycloak/data/import:ro]

  opa:
    image: openpolicyagent/opa:0.70.0
    command: ["run", "--server", "--addr", ":8181", "/policies"]
    ports: ["8181:8181"]
    volumes: [../opa:/policies:ro]

volumes: { pg: {}, fuseki: {}, qdrant: {} }
