name: ontology-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env: { POSTGRES_USER: ksx_admin, POSTGRES_PASSWORD: ci, POSTGRES_DB: ksx_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ksx_admin" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성
        run: pip install openpyxl pyyaml rdflib pyshacl owlrl
      - name: 생성물 최신 여부·커버리지 (ksxgen check)
        run: PYTHONPATH=tools/ksxgen python -m ksxgen check --std standards --ext extensions/impix --out ontologies
      - name: S4 생성물 검증 (ksxgen verify — 문법·DL 선언·OWL RL 일관성·SHACL-SHACL·매핑)
        run: PYTHONPATH=tools/ksxgen python -m ksxgen verify --out ontologies && git diff --exit-code ontologies/report/verify.md
      - name: S4 DL 추론기 일관성 (ROBOT + HermiT, Core + IMPIX 확장)
        run: |
          curl -sSLo robot.jar https://github.com/ontodev/robot/releases/download/v1.9.7/robot.jar
          java -jar robot.jar reason --reasoner hermit --input ontologies/tbox/impix_ext.ttl --output /tmp/reasoned.ttl
          java -jar robot.jar validate-profile --profile DL --input ontologies/tbox/ksx9101_core.ttl --output /tmp/dl_core.txt || (head -20 /tmp/dl_core.txt; exit 1)
      - name: S4 속성 그래프 스키마 (Apache AGE에 두 번 적용 — 다시 실행 가능)
        run: |
          docker run -d --name age -e POSTGRES_PASSWORD=ci -p 5434:5432 apache/age:release_PG16_1.5.0
          for i in $(seq 1 30); do PGPASSWORD=ci psql -h localhost -p 5434 -U postgres -c "select 1" >/dev/null 2>&1 && break; sleep 2; done
          PGPASSWORD=ci psql -h localhost -p 5434 -U postgres -v ON_ERROR_STOP=1 -q -c "CREATE EXTENSION IF NOT EXISTS age"
          for n in 1 2; do PGPASSWORD=ci psql -h localhost -p 5434 -U postgres -v ON_ERROR_STOP=1 -q -o /dev/null -f ontologies/graph/age_schema.sql; done
          PGPASSWORD=ci psql -h localhost -p 5434 -U postgres -At -c "select kind, count(*) from ag_catalog.ag_label l join ag_catalog.ag_graph g on l.graph = g.graphid where g.name = 'ksx_graph' group by 1 order by 1" | tee age.txt
          grep -q "^v|82$" age.txt && grep -q "^e|71$" age.txt   # 노드 81·관계 70 + AGE 기본 라벨 각 1
      - name: 웹 콘솔 데이터 최신 여부
        run: python tools/build_web.py && git diff --exit-code web/
      - name: 생성기 회귀 시험
        run: python tests/coverage/test_ksxgen.py
      - name: ksxkg 회귀 시험(S5 사업장 그래프 배정·N-Quads 분할·Ontop 합본)
        run: python tests/coverage/test_ksxkg.py
      - name: S2 표준 매핑 완료 기준·최신 여부 (automap check)
        run: PYTHONPATH=tools/automap python -m automap check --plan mapping/impix/s2_plan.yaml
      - name: automap 회귀 시험
        run: python tests/coverage/test_automap.py
      - name: S3 생성물 최신 여부 (ksxload check)
        run: PYTHONPATH=tools/ksxload python -m ksxload check --plan mapping/impix/s3_plan.yaml
      - name: ksxload 회귀 시험
        run: python tests/coverage/test_ksxload.py
      - name: E2E 최소 시험 (DDL → 시드 → OBDA → SHACL → 규칙)
        env:
          PGPASSWORD: ci
          KSX_TEST_PSQL: "-h localhost -p 5432 -U ksx_admin -d ksx_test"
        run: python tests/regression/test_e2e_minimal.py

  # S3 적재 E2E: IMPIX 원천 → stg → dbt(xfm) → 표준 원장 + 대사 — 실제 dbt로 실행
  s3-load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci, POSTGRES_DB: ksx }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci
      POSTGRES_USER: postgres
      POSTGRES_SUPERUSER_PASSWORD: ci
      IMPIX_SRC_HOST: localhost
      IMPIX_SRC_PORT: "5432"
      IMPIX_SRC_READER_PASSWORD: ci-reader
      KSX_DB_HOST: localhost
      KSX_DB_PORT: "5432"
      KSX_OWNER_PASSWORD: ci-owner
      KSX_LOADER_PASSWORD: ci-loader
      KSX_READER_PASSWORD: ci-reader2
      KSX_BOD_PASSWORD: ci-bod
      KSX_AUDIT_PASSWORD: ci-audit
      PYTHONPATH: tools/ksxload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성(dbt-postgres)
        run: pip install "dbt-core>=1.8,<1.9" "dbt-postgres==1.8.2" "PyYAML==6.0.2" "openpyxl==3.1.5"
      - name: IMPIX 원천 초기화(impix-src init 스크립트)
        run: |
          I=infra/docker-compose/impix-src/init
          bash $I/00-databases.sh
          for f in 10-erp-schema.sql 15-erp-scm-schema.sql 20-erp-seed.sql 30-mes-schema.sql 40-mes-seed.sql \
                   45-erp-scm-seed.sql 60-qms-schema.sql 70-qms-seed.sql 90-grants.sql; do
            psql -q -v ON_ERROR_STOP=1 -d postgres -f $I/$f
          done
      - name: 원장 DB 초기화(S0 postgres init 10·20)
        run: |
          bash infra/docker-compose/postgres/init/10-ksx-roles-schemas.sh
          psql -q -v ON_ERROR_STOP=1 -d ksx -f infra/docker-compose/postgres/init/20-ksx-audit-rls.sql
      - name: ksxload ddl
        run: python -m ksxload ddl
      - name: ksxload stage
        run: python -m ksxload stage
      - name: dbt build (seed → run → test)
        run: |
          set -o pipefail
          python -m ksxload dbt build 2>&1 | tee dbt.out
      - name: dbt 오류 요약(실패 시 주석으로)
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' dbt.out | grep -v "^\s*$" | tail -45 | while IFS= read -r l; do echo "::error::$l"; done
      - name: ksxload publish
        run: python -m ksxload publish
      - name: SC06-03 LOT 추적(표준 원장)
        run: |
          psql -d ksx -U ksx_loader -f etl/checks/impix/sc06_03_claim_lot_trace.sql | tee trace.txt
          grep -q "DCM-02" trace.txt && grep -q "FUNC-LEK 13" trace.txt
        env: { PGPASSWORD: ci-loader }
      - name: ksxload review(정제 규칙 검토서 — 미결정 0)
        run: python -m ksxload review --out /tmp/review.xlsx | tee review.txt && grep -q "미결정 0" review.txt
      - name: S4 물질화 매핑을 적재된 원장에 실행(Morph-KGC) — 가상화 매핑(OBDA)과 트리플이 같아야 함
        run: |
          pip install -q morph-kgc psycopg2-binary sqlalchemy
          pip show morph-kgc sqlalchemy psycopg2-binary | grep -E "^(Name|Version)"
          M=$(ls ontologies/mappings/rml/*.rml.ttl | paste -sd, -)
          printf '[CONFIGURATION]\noutput_file=/tmp/mkgc.nt\noutput_format=N-TRIPLES\nna_values=,None,NULL,null,NaN,nan,<NA>,NaT\n[ksx]\nmappings=%s\ndb_url=postgresql+psycopg2://postgres:ci@localhost:5432/ksx\n' "$M" > /tmp/mkgc.ini
          python -m morph_kgc /tmp/mkgc.ini
          for o in ksx9101 impix_ext; do python tests/e2e/obda_exec.py ontologies/mappings/$o.obda "-h localhost -U postgres -d ksx"; done | sort -u > /tmp/obda.nt
          a=$(sort -u /tmp/mkgc.nt | wc -l); b=$(wc -l < /tmp/obda.nt)
          echo "Morph-KGC $a · OBDA $b"; echo "::notice::S4 물질화 트리플 Morph-KGC $a · OBDA $b"
          awk '{print $2}' /tmp/mkgc.nt | sort | uniq -c | sort -k2 > /tmp/p1; awk '{print $2}' /tmp/obda.nt | sort | uniq -c | sort -k2 > /tmp/p2
          diff /tmp/p1 /tmp/p2 | head -20
          test "$a" = "$b"
          sort -u /tmp/mkgc.nt > /tmp/mkgc.s.nt; n=$(comm -3 /tmp/mkgc.s.nt /tmp/obda.nt | wc -l)
          echo "::notice::S4 물질화·가상화 트리플 내용 차이 $n"; comm -3 /tmp/mkgc.s.nt /tmp/obda.nt | head -6
          test "$n" = 0
      - name: S5 Fuseki·Ontop 기동(S0 이미지 그대로, Ontop은 Core + 확장 합본 매핑)
        run: |
          docker build -q -t ksx/fuseki:ci --build-arg JENA_VERSION=5.2.0 infra/docker-compose/fuseki
          docker build -q -t ksx/ontop:ci --build-arg ONTOP_VERSION=5.2.1 --build-arg PG_JDBC_VERSION=42.7.4 infra/docker-compose/ontop
          docker run -d --name fuseki --network host -v $PWD/infra/docker-compose/fuseki/config.ttl:/fuseki/config.ttl:ro ksx/fuseki:ci --config=/fuseki/config.ttl
          docker run -d --name ontop --network host -v $PWD/ontologies:/opt/onto:ro \
            -e ONTOP_ONTOLOGY_FILE=/opt/onto/ontop/ksx.ttl -e ONTOP_MAPPING_FILE=/opt/onto/ontop/ksx.obda \
            -e ONTOP_DB_URL=jdbc:postgresql://localhost:5432/ksx -e ONTOP_DB_USER=ksx_reader -e ONTOP_DB_PASSWORD=ci-reader2 \
            -e ONTOP_DB_DRIVER=org.postgresql.Driver -e ONTOP_LAZY_INIT=false ksx/ontop:ci
          for i in $(seq 1 60); do curl -fsS 'http://localhost:3030/ksx/query?query=ASK%7B%7D' >/dev/null 2>&1 && break; sleep 3; done
          for i in $(seq 1 60); do curl -fsS 'http://localhost:8080/sparql?query=ASK%7B%3Fs%20%3Fp%20%3Fo%7D' >/dev/null 2>&1 && break; sleep 3; done
          curl -fsS 'http://localhost:8080/sparql?query=ASK%7B%3Fs%20%3Fp%20%3Fo%7D' || (docker logs ontop 2>&1 | grep -v WARN | tail -40; exit 1)
      - name: S5 물질화(ksxkg materialize — 원장 → 사업장 Named Graph → Fuseki)
        env: { FUSEKI_URL: "http://localhost:3030/ksx", ONTOP_URL: "http://localhost:8080/sparql", PYTHONPATH: tools/ksxkg }
        run: python -m ksxkg materialize
      - name: S5 완료 기준(ksxkg check — 가상 = SQL, 물질화 = 기대치, 사업장 그래프 분리)
        env: { FUSEKI_URL: "http://localhost:3030/ksx", ONTOP_URL: "http://localhost:8080/sparql", PYTHONPATH: tools/ksxkg }
        run: |
          python -m ksxkg check
          cat mapping/impix/S5_검증결과.md
      - name: S5 다시 적재해도 같은 결과(그래프 단위 교체)
        env: { FUSEKI_URL: "http://localhost:3030/ksx", ONTOP_URL: "http://localhost:8080/sparql", PYTHONPATH: tools/ksxkg }
        run: python -m ksxkg materialize --skip-morph && python -m ksxkg check
      - name: S5 실패 시 Fuseki·Ontop 로그
        if: failure()
        run: |
          docker logs fuseki 2>&1 | tail -30 || true
          docker logs ontop 2>&1 | grep -v WARN | tail -30 || true
