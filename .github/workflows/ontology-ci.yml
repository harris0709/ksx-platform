name: ontology-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env: { POSTGRES_USER: ksx_admin, POSTGRES_PASSWORD: ci, POSTGRES_DB: ksx_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ksx_admin" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 의존성
        run: pip install openpyxl pyyaml rdflib pyshacl
      - name: 생성물 최신 여부·커버리지 (ksxgen check)
        run: PYTHONPATH=tools/ksxgen python -m ksxgen check --std standards --ext extensions/impix --out ontologies
      - name: 웹 콘솔 데이터 최신 여부
        run: python tools/build_web.py && git diff --exit-code web/
      - name: 생성기 회귀 시험
        run: python tests/coverage/test_ksxgen.py
      - name: E2E 최소 시험 (DDL → 시드 → OBDA → SHACL → 규칙)
        env:
          PGPASSWORD: ci
          KSX_TEST_PSQL: "-h localhost -p 5432 -U ksx_admin -d ksx_test"
        run: python tests/regression/test_e2e_minimal.py
